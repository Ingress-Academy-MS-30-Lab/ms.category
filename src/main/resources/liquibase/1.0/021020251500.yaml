databaseChangeLog:
  - changeSet:
      id: 001-create-categories-table
      author: peyman
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: parent_category_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_categories_parent
                    references: categories(id)
                    nullable: true
                    onDelete: SET NULL