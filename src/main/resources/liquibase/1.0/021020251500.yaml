databaseChangeLog:
  - changeSet:
      id: 001-create-categories-table
      author: peyman
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
              - column:
                  name: parent_category_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_categories_parent
                    references: categories(id)
                    nullable: true
                    onDelete: SET NULL